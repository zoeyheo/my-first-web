<svg xmlns="http://www.w3.org/2000/svg" width="900" height="550" viewBox="0 0 900 550">
  <!-- POP 카드 9 × 5.5cm (10px = 1mm) -->
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0B3D91"/>
      <stop offset="1" stop-color="#14A3C7"/>
    </linearGradient>
    <linearGradient id="ecgFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14A3C7" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#14A3C7" stop-opacity="0.55"/>
      <stop offset="0.75" stop-color="#14A3C7" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#14A3C7" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 배경 -->
  <rect width="900" height="550" fill="#FFFFFF"/>
  <!-- 상단 브랜드 바 -->
  <rect x="0" y="0" width="900" height="14" fill="url(#bar)"/>

  <!-- 배경 심전도 파형 -->
  <path d="M0 470 H330 L344 470 L352 458 L360 470 L374 470 L382 480 L396 410 L410 500 L420 470 L440 470 L456 452 L474 470 H900"
        fill="none" stroke="url(#ecgFade)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 제품명 배지 -->
  <rect x="340" y="98" width="220" height="50" rx="25" fill="none" stroke="#14A3C7" stroke-width="3"/>
  <text x="450" y="132" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif"
        font-size="26" font-weight="700" letter-spacing="4" fill="#14A3C7">CARDIO EM</text>

  <!-- 회사명 -->
  <text x="450" y="262" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif"
        font-size="76" font-weight="800" fill="#0B3D91">헬스리안 <tspan font-weight="600" font-size="60" fill="#0B3D91">(Healthrian)</tspan></text>

  <!-- 카테고리 -->
  <text x="450" y="340" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif"
        font-size="40" font-weight="500" fill="#5A6475">- 웨어러블 디바이스 -</text>
</svg>
