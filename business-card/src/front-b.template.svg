<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="550" height="850" viewBox="0 0 550 850">
  <!-- Scale: 1 mm = 10 px. Trim 55 x 85 mm. Safe area 49 x 79 mm (3 mm inset). -->
  <!-- Version B: device + holder + adhesive pad at 1:1. Holder/pad sizes are estimated from a low-res photo. -->
  <defs>
    <clipPath id="card-clip-b"><rect width="550" height="850"/></clipPath>
    <linearGradient id="em-gradient-b" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1676C9"/>
      <stop offset="1" stop-color="#3FA9E6"/>
    </linearGradient>
    <linearGradient id="clip-gradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E3E6E9"/>
    </linearGradient>
    <linearGradient id="rail-gradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ECEEF0"/>
      <stop offset="1" stop-color="#BCC1C7"/>
    </linearGradient>
  </defs>
  <g id="Card_Front_B" clip-path="url(#card-clip-b)">
    <rect id="Background" width="550" height="850" fill="#FFFFFF"/>

    <g id="Holder_ActualSize_Estimated">
      <path id="Adhesive_Pad" fill="#E2E4E7" stroke="#D3D6DA" stroke-width="1.5" d="M-259 286C-259 156 -207 96 -107 96L953 96L673 866C653 926 613 986 553 986L-127 986C-217 986 -259 926 -259 846Z"/>
      <path id="Clip_Block_Shadow" fill="#000000" fill-opacity="0.07" transform="translate(4 9)" d="M38 394L-96 394Q-124 394 -124 422L-124 587Q-124 672 -39 672L38 672Z"/>
      <path id="Clip_Block" fill="url(#clip-gradient)" stroke="#CDD1D6" stroke-width="1.5" d="M38 394L-96 394Q-124 394 -124 422L-124 587Q-124 672 -39 672L38 672Z"/>
      <rect id="Holder_Rail_Right" x="510" y="387" width="31" height="274" rx="5" fill="url(#rail-gradient)" stroke="#B5BAC0" stroke-width="1"/>
      <rect id="Holder_Lip_Bottom" x="190" y="790" width="170" height="37" rx="6" fill="#CDD2D7" stroke="#B9BEC4" stroke-width="1"/>
      <rect id="Holder_Lip_Top" x="232" y="236" width="79" height="18" rx="3" fill="#D3D7DB" stroke="#BDC2C8" stroke-width="1"/>
    </g>

    <g id="Product_Photo_ActualSize_48.4x57.0mm">
      <image id="CARDIO_EM_Product" x="-47.2" y="197" width="683" height="727.5" preserveAspectRatio="none" xlink:href="__PRODUCT__" href="__PRODUCT__"/>
    </g>

    <g id="Logo_HEALTHRIAN">
      <g id="Logo_Mark" transform="translate(35 36)">
        <path id="Mark_L_Top" fill="#1A95DC" d="M0 9A8 8 0 0 1 16 9C16 15 11 18 10.5 22L5.5 22C5 18 0 15 0 9Z"/>
        <path id="Mark_L_Bottom" fill="#8DC63F" d="M0 35A8 8 0 0 0 16 35C16 29 11 26 10.5 22L5.5 22C5 26 0 29 0 35Z"/>
        <path id="Mark_R_Top" fill="#8DC63F" transform="translate(19 0)" d="M0 9A8 8 0 0 1 16 9C16 15 11 18 10.5 22L5.5 22C5 18 0 15 0 9Z"/>
        <path id="Mark_R_Bottom" fill="#1A95DC" transform="translate(19 0)" d="M0 35A8 8 0 0 0 16 35C16 29 11 26 10.5 22L5.5 22C5 26 0 29 0 35Z"/>
      </g>
      <text id="Logo_Wordmark" x="84" y="69" font-family="Montserrat, sans-serif" font-weight="700" font-size="28" letter-spacing="2.5" fill="#464B53">HEALTHRIAN</text>
    </g>

    <g id="Headline">
      <text id="Category" x="35" y="134" font-family="Source Sans 3, sans-serif" font-weight="400" font-size="24" fill="#2B3440">Patch-type 12-lead ECG</text>
      <text id="Product_Name" x="32" y="194" font-family="Montserrat, sans-serif" font-weight="800" font-size="64" letter-spacing="-1" fill="#0B1F3A">CARDIO <tspan id="Product_Name_EM" fill="url(#em-gradient-b)">EM</tspan></text>
      <text id="Actual_Size_Label" x="35" y="226" font-family="Source Sans 3, sans-serif" font-weight="600" font-size="15" letter-spacing="2" fill="#56616D">ACTUAL SIZE  ·  WITH HOLDER</text>
    </g>

    <g id="Guides_Hide_Before_Print" visibility="hidden">
      <rect id="Safe_Area_49x79mm" x="30" y="30" width="490" height="790" fill="none" stroke="#FF3B30" stroke-width="1" stroke-dasharray="6 4"/>
      <rect id="Product_Body_48.4x57.0mm" x="33" y="246" width="484" height="570" fill="none" stroke="#007AFF" stroke-width="1"/>
    </g>
  </g>
</svg>
